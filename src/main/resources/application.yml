server:
  port: 9091

spring:
  web:
    resources:
      static-locations:
        - "classpath:/static/"
        - "file:WebSource/"
  datasource:
    url: "${DB_URL:jdbc:mysql://127.0.0.1:3306/tran_db?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&connectTimeout=5000&socketTimeout=30000}"
    username: "${DB_USER:root}"
    password: "${DB_PASSWORD:}"
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 2000
      max-lifetime: 600000
      idle-timeout: 120000
    tableName: "location"
    sql: "INSERT INTO location(location_name,location,type,address,id,created_at,update_at,role) value(?,?,?,?,?,?,?,?) on DUPLICATE key update update_at=values(update_at)"

amap:
  webserviceKey: "${AMAP_WEBSERVICE_KEY:}"

dispatch:
  revenuePerTonKm: 1.50
  cargoLossExpK: 1.05
  cargoLossBaseCoeff: 3.00
  loadingCostPerTon: 8.00
  waitBonusPerHour: 20.00
  waitBonusCap: 300.00
  penaltyPerTonPerHour: 5.00
  schedulerEnabled: false

vehicleType:
  small15:
    actualSpeedKmh: 100
    simSpeedKms: 200
    wearCostPerHour: 18
    fuelConsumptionPer100km: 9
    fuelPricePerLiter: 8
    maxLoadTon: 1.5
  medium6:
    actualSpeedKmh: 95
    simSpeedKms: 200
    wearCostPerHour: 30
    fuelConsumptionPer100km: 16
    fuelPricePerLiter: 8
    maxLoadTon: 6
  large15:
    actualSpeedKmh: 90
    simSpeedKms: 200
    wearCostPerHour: 46
    fuelConsumptionPer100km: 28
    fuelPricePerLiter: 8
    maxLoadTon: 15
  heavy40:
    actualSpeedKmh: 80
    simSpeedKms: 200
    wearCostPerHour: 75
    fuelConsumptionPer100km: 42
    fuelPricePerLiter: 8
    maxLoadTon: 40
