
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>高德路径规划小车模拟</title>
    <link rel="stylesheet" href="../css/runCar.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="dns-prefetch" href="//webapi.amap.com">
    <link rel="preconnect" href="https://webapi.amap.com" crossorigin>
    <link rel="dns-prefetch" href="//restapi.amap.com">
    <link rel="preconnect" href="https://restapi.amap.com" crossorigin>

    <!-- 高德 JS API --><script>
    window._AMapSecurityConfig = {
        securityJsCode: "f68e6b064bbd76011d899deded77ccb8"
    };
</script>
    <script src="https://webapi.amap.com/maps?v=2.0&key=ad6f8e93565f8cc0388a2998ca47e4fe"></script>

    <script src="../js/axios.min.js"></script>
</head>

<body>

<div id="map"></div>

<!-- 右下控制面板 -->
<div id="control-panel">
    <h3>小车控制台</h3>

    <label>下一辆小车速度：<span id="speed-value">0</span>km/h</label>
    <input type="range" min="300" max="3000" id="speed-range">

    <button id="add-car-btn">添加随机小车</button>
    <button id="clear-all-btn">清空所有小车与路径</button>
    <h4>批量添加小车</h4>
    <label>数量：<span id="multi-count-value">100</span></label>
    <input type="range" min="100" max="1000" value="100" id="multi-count-range">

    <button id="add-multi-car-btn">一键批量添加小车</button>

    <h4>小车列表</h4>
    <div id="car-list"></div>
</div>
<div id="poi-legend"></div>


<script src="../js/runCar.js"></script>
<script src="../js/sidebar.js"></script>

</body>
</html>
