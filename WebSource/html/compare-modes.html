<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>调度模式对比</title>
<link rel="stylesheet" href="../css/sidebar.css">
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        font-family: "Microsoft YaHei", sans-serif;
        background:
            radial-gradient(circle at top left, rgba(59, 130, 246, 0.16), transparent 30%),
            radial-gradient(circle at top right, rgba(16, 185, 129, 0.14), transparent 28%),
            linear-gradient(180deg, #f8fbff 0%, #eef4f8 100%);
        color: #0f172a;
    }
    .page {
        max-width: 1320px;
        margin: 0 auto;
        padding: 24px 20px 32px;
    }
    .hero {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        align-items: flex-end;
        margin-bottom: 18px;
        padding: 24px 28px;
        border-radius: 24px;
        background: linear-gradient(135deg, rgba(15, 23, 42, 0.92), rgba(30, 41, 59, 0.88));
        color: #f8fafc;
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.18);
    }
    .hero h1 {
        margin: 0 0 8px;
        font-size: 32px;
        letter-spacing: 1px;
    }
    .hero p {
        margin: 0;
        max-width: 720px;
        color: #cbd5e1;
        line-height: 1.7;
    }
    .hero-meta {
        text-align: right;
        min-width: 220px;
    }
    .hero-meta .meta-label {
        display: block;
        font-size: 12px;
        color: #94a3b8;
        margin-bottom: 4px;
    }
    .hero-meta .meta-value {
        font-size: 14px;
        font-weight: 700;
    }
    .toolbar {
        display: grid;
        grid-template-columns: 180px 180px 1fr;
        gap: 12px;
        align-items: end;
        margin-bottom: 18px;
        padding: 18px 20px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.16);
        box-shadow: 0 14px 35px rgba(148, 163, 184, 0.14);
    }
    .field label {
        display: block;
        margin-bottom: 6px;
        font-size: 12px;
        font-weight: 700;
        color: #475569;
    }
    .field input {
        width: 100%;
        border: 1px solid #cbd5e1;
        border-radius: 12px;
        padding: 11px 12px;
        font-size: 14px;
        background: #fff;
    }
    .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
    }
    button {
        border: none;
        border-radius: 12px;
        padding: 11px 18px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 700;
        transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
    }
    button:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 12px 22px rgba(15, 23, 42, 0.12);
    }
    button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
        box-shadow: none;
    }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-secondary { background: #0f766e; color: #fff; }
    .btn-ghost { background: #e2e8f0; color: #334155; }
    .summary {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 18px;
    }
    .summary-card {
        padding: 16px 18px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.14);
        box-shadow: 0 10px 28px rgba(148, 163, 184, 0.12);
    }
    .summary-card .label {
        display: block;
        margin-bottom: 8px;
        font-size: 12px;
        font-weight: 700;
        color: #64748b;
    }
    .summary-card .value {
        font-size: 26px;
        font-weight: 800;
    }
    .good { color: #059669; }
    .bad { color: #dc2626; }
    .neutral { color: #0f172a; }
    .compare-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
    }
    .panel {
        padding: 18px;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid rgba(148, 163, 184, 0.14);
        box-shadow: 0 14px 36px rgba(148, 163, 184, 0.14);
    }
    .panel.baseline { border-top: 5px solid #ef4444; }
    .panel.optimized { border-top: 5px solid #2563eb; }
    .panel h2 {
        margin: 0 0 12px;
        font-size: 20px;
    }
    .panel-subtitle {
        margin: 0 0 14px;
        color: #64748b;
        font-size: 13px;
    }
    .metric-list {
        display: grid;
        gap: 9px;
    }
    .metric-row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 10px 12px;
        border-radius: 14px;
        background: #f8fafc;
    }
    .metric-row .metric-label {
        color: #475569;
        font-size: 13px;
    }
    .metric-row .metric-value {
        font-weight: 800;
        font-size: 14px;
        text-align: right;
    }
    .compare-note {
        margin-top: 14px;
        padding: 12px 14px;
        border-radius: 14px;
        background: #eff6ff;
        color: #1d4ed8;
        font-size: 13px;
        line-height: 1.7;
    }
    .status {
        margin-top: 14px;
        min-height: 22px;
        font-size: 13px;
        color: #475569;
    }
    @media (max-width: 980px) {
        .toolbar,
        .summary,
        .compare-grid {
            grid-template-columns: 1fr;
        }
        .actions {
            justify-content: flex-start;
        }
        .hero {
            flex-direction: column;
            align-items: flex-start;
        }
        .hero-meta {
            text-align: left;
        }
    }
</style>
</head>
<body>
<div class="page">
    <section class="hero">
        <div>
            <h1>基线模式 vs 优化模式</h1>
        </div>
        <div class="hero-meta">
            <span class="meta-label">数据来源</span>
            <div class="meta-value">`/stats/compare`</div>
        </div>
    </section>

    <section class="toolbar">
        <div class="field">
            <label for="vehicles">车辆数量</label>
            <input id="vehicles" type="number" min="1" step="1" value="10">
        </div>
        <div class="field">
            <label for="orders">订单数量</label>
            <input id="orders" type="number" min="1" step="1" value="20">
        </div>
        <div class="actions">
            <button id="btn-compare-current" class="btn-secondary">基于当前数据对比</button>
            <button id="btn-generate-compare" class="btn-primary">生成新场景并对比</button>
            <button id="btn-refresh-overview" class="btn-ghost">刷新总览</button>
        </div>
    </section>

    <section class="summary" id="summary"></section>

    <section class="compare-grid">
        <article class="panel baseline">
            <h2>基线模式</h2>
            <p class="panel-subtitle">最近车辆优先，单车单次只接一个订单。</p>
            <div class="metric-list" id="baseline-metrics"></div>
        </article>
        <article class="panel optimized">
            <h2>优化模式</h2>
            <p class="panel-subtitle">按后端优化策略对同一场景进行完整仿真。</p>
            <div class="metric-list" id="optimized-metrics"></div>
            <div class="compare-note" id="compare-note"></div>
        </article>
    </section>

    <div class="status" id="status"></div>
</div>

<script src="../js/compare-modes.js"></script>
<script src="../js/sidebar.js"></script>
</body>
</html>
